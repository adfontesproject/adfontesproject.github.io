<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis notas — Ad Fontes</title>
<meta name="description" content="Ad Fontes · Tus notas de prédicas y estudio, guardadas y privadas.">
<link rel="icon" href="Logo%20Ad%20Fontes.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --carbon:#262626; --carbon2:#383838; --gold:#b98d3e; --gold-light:#d8b571;
  --cream:#faf7f1; --paper:#ffffff; --ink:#2b2b2b; --ink-soft:#6a6a6a;
  --line:#e6dfd2; --green:#3e7a4e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'EB Garamond',Georgia,serif;font-size:19px;line-height:1.7}
.topbar{position:sticky;top:0;z-index:100;background:var(--carbon);display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.55rem 1rem;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:.55rem;text-decoration:none}
.brand img{height:34px;width:34px;object-fit:contain}
.brand div{font-family:'Cormorant Garamond',serif;font-size:1.25rem;color:#fff;line-height:1}
.brand small{display:block;font-family:'Inter',sans-serif;font-size:.58rem;letter-spacing:.22em;color:var(--gold-light);margin-top:2px}
.lupa{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:#333;border:1px solid #4a4a4a;color:#e7e2d8;font-size:1.05rem;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
.lupa:hover{border-color:var(--gold);color:#fff}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:90;display:flex;background:var(--carbon);border-top:1px solid #3a3a38;padding-bottom:env(safe-area-inset-bottom,0)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:.5rem 0 .55rem;text-decoration:none;color:#9a948a;font-family:'Inter',sans-serif;font-size:.55rem;letter-spacing:0;border-top:2px solid transparent}
.tabbar a .ic{font-size:1.12rem;line-height:1}
.tabbar a.act{color:var(--gold);border-top-color:var(--gold)}
body{padding-bottom:78px}

.pagina{max-width:820px;margin:0 auto;padding:1.6rem 1.1rem 1rem}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:2rem;text-align:center;color:var(--carbon);margin:.2rem 0 .1rem}
.intro{text-align:center;color:var(--ink-soft);font-style:italic;max-width:560px;margin:0 auto 1.4rem}

.barra-notas{display:flex;gap:.6rem;align-items:center;margin-bottom:1.2rem}
.btn{font-family:'Inter',sans-serif;font-size:.85rem;font-weight:500;border-radius:10px;padding:.6rem 1rem;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--carbon);text-decoration:none;display:inline-flex;align-items:center;gap:.4rem}
.btn-pri{background:var(--carbon);color:#fff;border-color:var(--carbon)}
.btn-pri:hover{background:#000}
.n-buscar{flex:1;font-family:'Inter',sans-serif;font-size:.85rem;padding:.6rem .8rem;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--carbon)}
.n-buscar:focus{outline:none;border-color:var(--gold)}

.editor{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.3rem;margin-bottom:1.4rem;display:none}
.editor.abierto{display:block}
.editor .fila{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:.7rem}
.editor label{font-family:'Inter',sans-serif;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:.25rem}
.editor input,.editor textarea{width:100%;font-family:'EB Garamond',serif;font-size:1rem;padding:.55rem .7rem;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
.editor input:focus,.editor textarea:focus{outline:none;border-color:var(--gold)}
.editor textarea{min-height:200px;line-height:1.6;resize:vertical}
.campo-tit{flex:2 1 220px}
.campo-fecha{flex:1 1 130px}
.campo-pas{flex:1 1 160px}
.editor .acc{display:flex;gap:.6rem;align-items:center;margin-top:.4rem}
.guardado{font-family:'Inter',sans-serif;font-size:.75rem;color:var(--green);margin-left:auto}

.lista{display:flex;flex-direction:column;gap:.8rem}
.nota{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:1rem 1.2rem;cursor:pointer;transition:.15s}
.nota:hover{border-color:var(--gold);transform:translateY(-1px)}
.nota .cab{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.nota .n-fecha{font-family:'Inter',sans-serif;font-size:.7rem;color:var(--gold);letter-spacing:.04em;text-transform:uppercase;font-weight:500}
.nota h3{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.35rem;color:var(--carbon);margin:.15rem 0}
.nota .n-pas{font-family:'Inter',sans-serif;font-size:.72rem;background:#f3ecdb;color:#7a5b1e;border-radius:20px;padding:.1rem .6rem;text-decoration:none}
.nota .n-pas:hover{background:#ead9b6}
.nota .n-cuerpo{color:var(--ink-soft);font-size:.95rem;line-height:1.5;margin:.4rem 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nota .n-borrar{float:right;background:none;border:none;cursor:pointer;color:#c0392b;opacity:.55;font-size:.85rem}
.nota .n-borrar:hover{opacity:1}

.vacio{background:var(--paper);border:1px dashed var(--line);border-radius:14px;padding:2.4rem 1.6rem;text-align:center;color:var(--ink-soft)}
.vacio h3{font-family:'Cormorant Garamond',serif;color:var(--carbon);font-size:1.4rem;margin:0 0 .4rem}
.aviso-nube{font-family:'Inter',sans-serif;font-size:.75rem;color:var(--ink-soft);text-align:center;margin:.4rem 0 1.2rem}
.aviso-nube b{color:var(--green)}

/* Editor a pantalla completa */
.ed-full{position:fixed;inset:0;z-index:300;background:var(--cream);display:none;flex-direction:column}
.ed-full.on{display:flex}
.ed-top{display:flex;align-items:center;gap:.7rem;padding:.6rem .9rem;background:var(--carbon);flex:0 0 auto}
.ed-x{background:none;border:1px solid #4a4a4a;color:#e7e2d8;border-radius:9px;padding:.5rem .8rem;font-family:'Inter',sans-serif;font-size:.82rem;cursor:pointer}
.ed-x:hover{border-color:var(--gold);color:#fff}
.ed-top .btn-pri{margin-left:auto}
.ed-top .guardado{color:var(--gold-light)}
.ed-cuerpo{flex:1;overflow-y:auto;max-width:820px;width:100%;margin:0 auto;padding:1.1rem 1.1rem 4rem;display:flex;flex-direction:column}
.ed-titulo{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.7rem;color:var(--carbon);border:none;background:none;padding:.3rem 0;width:100%}
.ed-titulo:focus{outline:none}
.ed-titulo::placeholder{color:#c3bdb0}
.ed-meta{display:flex;gap:1rem;flex-wrap:wrap;padding:.3rem 0 .6rem;border-bottom:1px solid var(--line);margin-bottom:.7rem}
.ed-meta label{font-family:'Inter',sans-serif;font-size:.78rem;color:var(--ink-soft);display:flex;align-items:center;gap:.35rem}
.ed-meta input{font-family:'Inter',sans-serif;font-size:.82rem;border:1px solid var(--line);border-radius:8px;padding:.35rem .5rem;background:#fff;color:var(--ink)}
.ed-meta input:focus{outline:none;border-color:var(--gold)}
.ed-barra{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:.25rem;align-items:center;background:var(--cream);padding:.4rem 0;margin-bottom:.4rem;border-bottom:1px solid var(--line)}
.ed-barra button{min-width:36px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;font-size:.9rem;color:var(--carbon);padding:0 .5rem}
.ed-barra button:hover{border-color:var(--gold)}
.ed-barra button:active{background:var(--cream)}
.ed-barra .ed-pas-btn{font-size:.8rem;color:#7a5b1e;background:#f3ecdb;border-color:#e6d6b3}
.ed-barra .ed-pas-btn:hover{background:#ead9b6}
.ed-sep{width:1px;height:22px;background:var(--line);margin:0 .25rem}
.ed-area{flex:1;min-height:45vh;font-family:'EB Garamond',serif;font-size:1.08rem;line-height:1.7;color:var(--ink);outline:none;padding:.3rem 0}
.ed-area:empty:before{content:attr(data-ph);color:#b7b1a4;font-style:italic}
.ed-area blockquote{border-left:3px solid var(--gold);margin:.7rem 0;padding:.3rem 0 .3rem 1rem;color:#4a4a4a;background:#fbf7ee}
.ed-area .cita-ref{font-family:'Inter',sans-serif;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:#8a6a24;display:block;margin-top:.3rem}
.ed-area .vn{color:var(--gold);font-family:'Inter',sans-serif;font-size:.7rem;vertical-align:super;margin-right:.15rem}

/* Mini ventana insertar pasaje */
.mini-ov{position:fixed;inset:0;z-index:340;background:rgba(20,18,14,.55);display:none;align-items:center;justify-content:center;padding:1rem}
.mini-ov.on{display:flex}
.mini-caja{background:#fff;border-radius:14px;padding:1.3rem 1.4rem;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mini-caja h4{font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--carbon);margin:0 0 .2rem}
.mini-caja p{font-family:'Inter',sans-serif;font-size:.8rem;color:var(--ink-soft);margin:0 0 .8rem}
.mini-caja input{width:100%;font-family:'EB Garamond',serif;font-size:1rem;padding:.55rem .7rem;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
.mini-caja input:focus{outline:none;border-color:var(--gold)}
.mini-acc{display:flex;gap:.6rem;margin-top:.9rem}
#insMsg{font-family:'Inter',sans-serif;font-size:.78rem;margin-top:.5rem;min-height:1rem}
#insMsg.err{color:#c0392b}

/* Formato dentro de la tarjeta de lista */
.nota .n-cuerpo b,.nota .n-cuerpo strong{font-weight:600}

@media(max-width:680px){
  .ed-titulo{font-size:1.4rem}
  .ed-cuerpo{padding:.9rem .9rem 4rem}
  .pagina{padding:1.2rem .8rem 1rem}
  h1{font-size:1.6rem}
  .campo-tit,.campo-fecha,.campo-pas{flex:1 1 100%}
}
</style>
</head>

<div class="topbar">
  <a class="brand" href="index.html"><img src="Logo%20Ad%20Fontes.png" alt=""><div>Ad Fontes<small>NOTAS</small></div></a>
  <a class="lupa" href="biblia.html?buscar" title="Buscar pasaje en la Biblia" aria-label="Buscar">🔍</a>
</div>

<div class="pagina">
  <h1>Mis notas</h1>
  <p class="intro">Un cuaderno para las prédicas y el estudio. «La palabra de Cristo more en abundancia en vosotros» (Col 3:16).</p>

  <div class="aviso-nube" id="avisoNube"></div>

  <div class="barra-notas">
    <button class="btn btn-pri" onclick="nuevaNota()">✚ Nueva nota</button>
    <input class="n-buscar" id="nBuscar" placeholder="Buscar en mis notas…" oninput="pintarLista()">
  </div>

  <div class="lista" id="lista"></div>
</div>

<!-- Editor a pantalla completa -->
<div class="ed-full" id="editor">
  <div class="ed-top">
    <button class="ed-x" onclick="cerrarEditor()">✕&nbsp; Cancelar</button>
    <span class="guardado" id="guardadoMsg"></span>
    <button class="btn btn-pri" onclick="guardarNota()">Guardar</button>
  </div>
  <div class="ed-cuerpo">
    <input id="edTitulo" class="ed-titulo" maxlength="120" placeholder="Título de la nota">
    <div class="ed-meta">
      <label>📅 <input id="edFecha" type="date"></label>
      <label>📖 <input id="edPasaje" maxlength="60" placeholder="Pasaje del sermón (opcional)"></label>
    </div>
    <div class="ed-barra">
      <button type="button" onmousedown="return fmt(event,'bold')" title="Negrita"><b>B</b></button>
      <button type="button" onmousedown="return fmt(event,'italic')" title="Cursiva"><i>I</i></button>
      <button type="button" onmousedown="return fmt(event,'underline')" title="Subrayado"><u>U</u></button>
      <span class="ed-sep"></span>
      <button type="button" onmousedown="return tam(event,'small')" title="Letra pequeña">A<span style="font-size:.68em">A</span></button>
      <button type="button" onmousedown="return tam(event,'normal')" title="Letra normal">A</button>
      <button type="button" onmousedown="return tam(event,'grande')" title="Letra grande" style="font-size:1.15em">A</button>
      <span class="ed-sep"></span>
      <button type="button" onmousedown="return fmt(event,'insertUnorderedList')" title="Lista de viñetas">☰</button>
      <button type="button" onmousedown="return cita(event)" title="Cita / bloque">❝</button>
      <span class="ed-sep"></span>
      <button type="button" class="ed-pas-btn" onmousedown="return abrirInsertar(event)" title="Insertar el texto de un pasaje">📖 Pasaje</button>

    <div id="edCuerpo" class="ed-area" contenteditable="true" data-ph="Escribe aquí lo que el Señor te va mostrando… Puedes pegar texto, dar formato o insertar un pasaje."></div>
  </div>
</div>

<!-- Mini ventana: insertar pasaje -->
<div class="mini-ov" id="ovInsertar" onclick="if(event.target===this)cerrarInsertar()">
  <div class="mini-caja">
    <h4>📖 Insertar pasaje</h4>
    <p>Se pegará el texto en <b>Reina-Valera 1909</b>, como cita.</p>
    <input id="insRef" placeholder="p. ej. Juan 3:16-17  ·  Salmos 23  ·  Jonás 4:2" onkeydown="if(event.key==='Enter')hacerInsertar()">
    <div id="insMsg"></div>
    <div class="mini-acc">
      <button class="btn btn-pri" onclick="hacerInsertar()">Insertar</button>
      <button class="btn" onclick="cerrarInsertar()">Cancelar</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
/* ===== utilidades ===== */
const NOMBRES = ['Génesis','Éxodo','Levítico','Números','Deuteronomio','Josué','Jueces','Rut','1 Samuel','2 Samuel','1 Reyes','2 Reyes','1 Crónicas','2 Crónicas','Esdras','Nehemías','Ester','Job','Salmos','Proverbios','Eclesiastés','Cantares','Isaías','Jeremías','Lamentaciones','Ezequiel','Daniel','Oseas','Joel','Amós','Abdías','Jonás','Miqueas','Nahúm','Habacuc','Sofonías','Hageo','Zacarías','Malaquías','Mateo','Marcos','Lucas','Juan','Hechos','Romanos','1 Corintios','2 Corintios','Gálatas','Efesios','Filipenses','Colosenses','1 Tesalonicenses','2 Tesalonicenses','1 Timoteo','2 Timoteo','Tito','Filemón','Hebreos','Santiago','1 Pedro','2 Pedro','1 Juan','2 Juan','3 Juan','Judas','Apocalipsis'];
function normTxt(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim(); }
const IDX = {}; NOMBRES.forEach(n => IDX[normTxt(n)] = n);
const esc = s => String(s == null ? '' : s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
function urlPasaje(p){
  const m = String(p).trim().match(/^(.+?)\s+(\d+)/);
  if(!m || !IDX[normTxt(m[1])]) return null;
  return 'biblia.html#' + encodeURIComponent(IDX[normTxt(m[1])]) + '/' + m[2];
}
function hoyISO(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fechaBonita(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ===== estado (offline-first: localStorage manda; la nube sincroniza) ===== */
const LS = 'af_cuaderno';
let notas = (() => { try { const v = JSON.parse(localStorage.getItem(LS) || '[]'); return Array.isArray(v) ? v : []; } catch(e){ return []; } })();
let editId = null;
let fbUser = null, fbDB = null;
function guardarLocal(){ localStorage.setItem(LS, JSON.stringify(notas)); }

/* ===== Firebase / sincronía ===== */
try{
  firebase.initializeApp({ apiKey:"AIzaSyDt3bA9HuXbIypVH_JRQMe-FGKkNfUDrv8", authDomain:"biblia-en-un-ano.firebaseapp.com", projectId:"biblia-en-un-ano", storageBucket:"biblia-en-un-ano.firebasestorage.app", messagingSenderId:"978571488009", appId:"1:978571488009:web:cd9e062e57a1b9b62801d8" });
  fbDB = firebase.firestore();
  firebase.auth().onAuthStateChanged(async u => {
    fbUser = u;
    pintarAviso();
    if(u) await sincronizar();
  });
}catch(e){}

function col(){ return fbDB.collection('notas').doc(fbUser.uid).collection('items'); }
async function sincronizar(){
  if(!fbUser || !fbDB) return;
  try{
    const snap = await col().get();
    const nube = {};
    snap.docs.forEach(d => nube[d.id] = d.data());
    const local = {}; notas.forEach(n => local[n.id] = n);
    /* la nube gana si su versión es más nueva */
    Object.values(nube).forEach(n => {
      if(!local[n.id] || (n.u || 0) > (local[n.id].u || 0)) local[n.id] = n;
    });
    /* subir las locales que faltan o son más nuevas */
    for(const n of Object.values(local)){
      const c = nube[n.id];
      if(!c || (n.u || 0) > (c.u || 0)){ try{ await col().doc(n.id).set(n); }catch(e){} }
    }
    notas = Object.values(local).filter(n => !n.del);
    guardarLocal();
    pintarLista();
  }catch(e){}
}
async function guardarNube(n){ if(fbUser && fbDB){ try{ await col().doc(n.id).set(n); }catch(e){} } }
async function borrarNube(id){ if(fbUser && fbDB){ try{ await col().doc(id).delete(); }catch(e){} } }

/* ===== editor enriquecido ===== */
const NUMLIB = {}; NOMBRES.forEach((n,i) => NUMLIB[normTxt(n)] = i+1);
const LIBROS_UNICAP = { 'abdias':1, 'filemon':1, '2 juan':1, '3 juan':1, 'judas':1 };
const cacheV = {};
const $ = id => document.getElementById(id);

/* Sanitiza el HTML de la nota (es contenido propio, pero quitamos scripts y atributos peligrosos) */
function sanitizeHTML(html){
  const t = document.createElement('div');
  t.innerHTML = String(html || '');
  t.querySelectorAll('script,style,iframe,object,embed,link,meta,form').forEach(e => e.remove());
  t.querySelectorAll('*').forEach(el => {
    [...el.attributes].forEach(a => {
      const n = a.name.toLowerCase();
      if(n.startsWith('on') || (['href','src'].includes(n) && /^\s*javascript:/i.test(a.value))) el.removeAttribute(a.name);
    });
  });
  return t.innerHTML;
}
function stripHTML(html){
  const t = document.createElement('div');
  t.innerHTML = sanitizeHTML(html);
  return (t.textContent || '').replace(/\s+/g, ' ').trim();
}
function esHTML(s){ return /<[a-z][\s\S]*>/i.test(String(s || '')); }

function abrirEditor(){ $('editor').classList.add('on'); document.body.style.overflow = 'hidden'; }
function nuevaNota(){
  editId = null;
  $('edTitulo').value = '';
  $('edFecha').value = hoyISO();
  $('edPasaje').value = '';
  $('edCuerpo').innerHTML = '';
  $('guardadoMsg').textContent = '';
  abrirEditor();
  setTimeout(() => $('edTitulo').focus(), 60);
}
function editarNota(id){
  const n = notas.find(x => x.id === id); if(!n) return;
  editId = id;
  $('edTitulo').value = n.t || '';
  $('edFecha').value = n.f || hoyISO();
  $('edPasaje').value = n.p || '';
  const cuerpo = n.c || '';
  if(esHTML(cuerpo)) $('edCuerpo').innerHTML = sanitizeHTML(cuerpo);
  else $('edCuerpo').innerText = cuerpo;
  $('guardadoMsg').textContent = '';
  abrirEditor();
}
function cerrarEditor(){ $('editor').classList.remove('on'); document.body.style.overflow = ''; editId = null; }
function guardarNota(){
  const t = $('edTitulo').value.trim();
  const html = sanitizeHTML($('edCuerpo').innerHTML);
  const texto = ($('edCuerpo').textContent || '').trim();
  if(!t && !texto){ const g = $('guardadoMsg'); g.textContent = 'Escribe al menos un título o una nota.'; g.style.color = '#f0b8b8'; return; }
  const n = {
    id: editId || uid(),
    t: t.slice(0,120),
    f: $('edFecha').value || hoyISO(),
    p: $('edPasaje').value.trim().slice(0,60),
    c: html.slice(0,60000),
    u: Date.now()
  };
  const i = notas.findIndex(x => x.id === n.id);
  if(i >= 0) notas[i] = n; else notas.unshift(n);
  guardarLocal();
  guardarNube(n);
  const g = $('guardadoMsg'); g.style.color = 'var(--gold-light)';
  g.textContent = '✓ Guardada' + (fbUser ? ' y sincronizada' : '');
  editId = n.id;
  pintarLista();
  setTimeout(cerrarEditor, 550);
}
function borrarNota(id, ev){
  ev.stopPropagation();
  if(!confirm('¿Eliminar esta nota? No se puede deshacer.')) return;
  notas = notas.filter(x => x.id !== id);
  guardarLocal();
  borrarNube(id);
  pintarLista();
}

/* ----- barra de formato (execCommand: máxima compatibilidad, incl. Android) ----- */
function fmt(ev, cmd){ ev.preventDefault(); document.execCommand(cmd, false, null); $('edCuerpo').focus(); return false; }
function tam(ev, k){ ev.preventDefault(); document.execCommand('fontSize', false, {small:'2', normal:'3', grande:'5'}[k] || '3'); $('edCuerpo').focus(); return false; }
function cita(ev){ ev.preventDefault(); document.execCommand('formatBlock', false, 'blockquote'); $('edCuerpo').focus(); return false; }

/* ----- insertar un pasaje (RV1909) como cita ----- */
let rangoGuardado = null;
function guardarRango(){ const s = window.getSelection(); if(s && s.rangeCount && $('edCuerpo').contains(s.anchorNode)) rangoGuardado = s.getRangeAt(0).cloneRange(); }
function restaurarRango(){ $('edCuerpo').focus(); if(rangoGuardado){ const s = window.getSelection(); s.removeAllRanges(); s.addRange(rangoGuardado); } }
function abrirInsertar(ev){ ev.preventDefault(); guardarRango(); $('insRef').value = $('edPasaje').value || ''; $('insMsg').textContent=''; $('insMsg').className=''; $('ovInsertar').classList.add('on'); setTimeout(()=>$('insRef').focus(),60); return false; }
function cerrarInsertar(){ $('ovInsertar').classList.remove('on'); }
async function hacerInsertar(){
  const ref = $('insRef').value.trim();
  const msg = $('insMsg');
  const m = ref.match(/^([123]?\s?[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)\.?\s+(\d+)(?::([\d,\-]+))?$/);
  if(!m){ msg.className='err'; msg.textContent='Escribe algo como «Juan 3:16» o «Salmos 23».'; return; }
  const clave = normTxt(m[1]);
  const num = NUMLIB[clave];
  if(!num){ msg.className='err'; msg.textContent='No reconozco ese libro. Usa el nombre completo.'; return; }
  let cap = parseInt(m[2],10), vv = m[3];
  if(LIBROS_UNICAP[clave] && !vv){ vv = String(cap); cap = 1; }
  msg.className=''; msg.textContent='Cargando…';
  try{
    const url = 'https://api.getbible.net/v2/valera/'+num+'/'+cap+'.json';
    if(!cacheV[url]){ const r = await fetch(url); if(!r.ok) throw 0; cacheV[url] = await r.json(); }
    const todos = cacheV[url].verses || [];
    let nums = [];
    if(vv) vv.split(',').forEach(seg => { const ab = seg.split('-').map(Number); for(let i=ab[0]; i<=(ab[1]||ab[0]); i++) nums.push(i); });
    const sel = nums.length ? todos.filter(v => nums.includes(v.verse)) : todos;
    if(!sel.length){ msg.className='err'; msg.textContent='No encontré esos versículos.'; return; }
    const etiqueta = IDX[clave] + ' ' + cap + (vv ? ':'+vv : '');
    const cuerpo = sel.map(v => '<span class="vn">'+v.verse+'</span>'+esc(v.text.trim())+' ').join('');
    const html = '<blockquote>'+cuerpo+'<span class="cita-ref">— '+esc(etiqueta)+' (RV1909)</span></blockquote><p><br></p>';
    restaurarRango();
    document.execCommand('insertHTML', false, html);
    if(!$('edPasaje').value.trim()) $('edPasaje').value = etiqueta;
    cerrarInsertar();
  }catch(e){ msg.className='err'; msg.textContent='No pude cargar el texto. Revisa tu conexión.'; }
}

/* ===== render ===== */
function pintarAviso(){
  document.getElementById('avisoNube').innerHTML = fbUser
    ? '☁️ Tus notas se guardan en <b>la nube</b> — las verás en cualquier dispositivo con tu cuenta.'
    : 'Tus notas se guardan en <b>este dispositivo</b>. <a href="comunidad.html" style="color:var(--gold)">Inicia sesión</a> para guardarlas en la nube y no perderlas.';
}
function pintarLista(){
  const q = normTxt((document.getElementById('nBuscar')||{}).value || '');
  const arr = notas.slice().sort((a,b) => (b.f||'').localeCompare(a.f||'') || (b.u||0)-(a.u||0));
  const vis = q ? arr.filter(n => normTxt((n.t||'')+' '+stripHTML(n.c)+' '+(n.p||'')).includes(q)) : arr;
  const el = document.getElementById('lista');
  if(!notas.length){
    el.innerHTML = '<div class="vacio"><h3>Aún no hay notas</h3><p>Toca «✚ Nueva nota» para guardar tu primera prédica o estudio.</p></div>';
    return;
  }
  if(!vis.length){ el.innerHTML = '<div class="vacio"><p>Ninguna nota coincide con esa búsqueda.</p></div>'; return; }
  el.innerHTML = vis.map(n => {
    const url = n.p ? urlPasaje(n.p) : null;
    const chip = n.p ? (url
      ? '<a class="n-pas" href="'+url+'" onclick="event.stopPropagation()">📖 '+esc(n.p)+'</a>'
      : '<span class="n-pas">📖 '+esc(n.p)+'</span>') : '';
    return '<div class="nota" onclick="editarNota(\''+n.id+'\')">' +
      '<button class="n-borrar" onclick="borrarNota(\''+n.id+'\',event)" title="Eliminar">🗑</button>' +
      '<div class="cab"><span class="n-fecha">'+esc(fechaBonita(n.f))+'</span>'+chip+'</div>' +
      '<h3>'+esc(n.t || 'Sin título')+'</h3>' +
      (n.c ? '<p class="n-cuerpo">'+esc(stripHTML(n.c))+'</p>' : '') +
    '</div>';
  }).join('');
}

/* ===== arranque ===== */
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if($('ovInsertar').classList.contains('on')) cerrarInsertar();
    else if($('editor').classList.contains('on')) cerrarEditor();
  }
});
pintarAviso();
pintarLista();
</script>
